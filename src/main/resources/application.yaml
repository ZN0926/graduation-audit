server:
  port: 8080

spring:
  application:
    name: graduation-audit

  datasource:
    # 三项都可用环境变量覆盖，默认值用于本机开箱即跑；
    # 换机器/换库时只需改环境变量，不必改这个文件。
    url: '${DB_URL:jdbc:mysql://127.0.0.1:3306/audit_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}'
    username: ${DB_USER:audit}
    password: ${DB_PASSWORD:Audit@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 大模型配置：key 不写明文，从环境变量 LLM_API_KEY 读取
llm:
  # 只写到域名+路径前缀，不带 /v1：代码里会自己拼 /v1/chat/completions
  # 千问 MaaS 兼容模式：https://maas.qianwenaiapi.com/compatible-mode
  # 换回 DeepSeek 就是 https://api.deepseek.com
  base-url: ${LLM_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-v4.1-flash}
  timeout-seconds: 60

# actuator 只暴露 health：/actuator/health 能看存活与数据源状态，其余端点（env/beans 等）一律不开
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.audit: debug

# 上传文件落盘目录（相对工程根），Git 不跟踪
audit:
  upload-dir: uploads
